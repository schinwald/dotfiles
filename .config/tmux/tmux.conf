unbind C-b

unbind '"'
unbind %

# Add extended keys for ctrl+shift operations
set -s extended-keys on

# Recommended for image viewing
# TODO: investigate what this actually does
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Remap prefix to ctrl+a
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

set-option -g status-interval 1

# Reverse search on terminal buffer
bind / copy-mode \; send-keys ?

# Create a popup for switching tmux sessions
bind -n C-s display-popup -E 'zsh -f -i -c "~/.config/tmux/utils/switch_session.sh"'

# Smart vim-like pane navigation
bind-key -n 'C-h' if-shell '~/.config/tmux/utils/is_vim.sh' 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell '~/.config/tmux/utils/is_vim.sh' 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell '~/.config/tmux/utils/is_vim.sh' 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell '~/.config/tmux/utils/is_vim.sh' 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Create a new window
bind n new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"

# Switch windows using previous and next keywords
bind -n C-p previous-window
bind -n C-n next-window

# Split panes using | and -
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Don't rename windows automatically
set -g allow-rename off

# DESIGN TWEAKS

# Don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Copy mode
setw -g mode-style 'fg=black bg=red,bold'

# Panes
# set -g pane-border-style 'fg=red'
# set -g pane-active-border-style 'fg=yellow'

# #I: Window index (e.g., 0, 1, 2).
# #F: Window flags (e.g., * for the active window).
# #W: Window name.
# #T: Window title (usually the active command or process name).
# #S: Session name.
# #P: Current pane index.
# #D: Current pane path.

# Statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#292E42'

set -g status-left '#[fg=black,bold bg=green] ⧉ #{session_name} #[fg=green bg=#292E42] '
set -g status-left-length 20

set -g status-right-style 'fg=black,bold bg=green'
set -g status-right '#(~/.config/tmux/utils/status_right.sh)'
set -g status-right-length 100

setw -g window-status-current-style 'fg=green bg=#444D72'
setw -g window-status-current-format ' #W '

setw -g window-status-style 'fg=#CED9FF bg=#292E42'
setw -g window-status-format ' #W '

# Messages
set -g message-style 'fg=black bg=green,bold'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Enables saving and restoring sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save and restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin:/usr/sbin:/sbin"
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
