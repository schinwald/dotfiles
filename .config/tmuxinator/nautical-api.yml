name: nautical-api
root: ~/Projects/nautical-api

attach: false

on_project_start: git fetch --all
startup_window: editor

windows:
  - editor:
      panes:
        - main:
          - v
  - api:
      panes:
        - main:
          - dclg api-api
  - db:
      panes:
        - main:
          - dclg db
  - redis:
      panes:
        - main:
          - dclg redis
  - workers:
      panes:
        - main:
          - dclg worker
